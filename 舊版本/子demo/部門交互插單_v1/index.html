<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>昇嶺電子 插單入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面：內部單據。藍為主色、橘為強調；LINE 用綠。
   顏色意義：原文＝黑邊白底；AI＝淺藍；人確認／決定＝深藍實心；【我猜的】＝橘色虛線；低信心＝紅色虛線。 */
:root {
  /* 藍（主色）— 深 → 淺 */
  --b900: #00335F;
  --b800: #01457A;
  --b700: #01528F;
  --b600: #2468A2;
  --b500: #3E7FB4;
  --b300: #A9C6E2;
  --b100: #E4EEF7;
  --b50:  #F2F7FB;
  /* 橘（強調）— 深 → 淺 */
  --o800: #8A4E00;
  --o700: #E78C00;
  --o600: #FCA200;
  --o500: #FDB13A;
  --o300: #FECC72;
  --o100: #FFF3DD;
  /* LINE */
  --line-g: #06C755;
  --line-g-d: #04A346;
  --line-g-t: #027A36;
  --line-g-bg: #E7F9EE;

  --bg: #ECF0F4;
  --panel: #FFFFFF;
  --line: #D5DCE4;
  --line2: #A3B0BE;
  --ink: #14212E;
  --mute: #536273;
  --raw-bg: #FFFFFF;

  --human: var(--b900);
  --human-bg: #E8ECF2;
  --human-line: var(--b900);

  --ai: var(--b600);
  --ai-ink: var(--b800);
  --ai-bg: #EAF2FA;
  --ai-line: var(--b300);

  --guess: var(--o800);
  --guess-bg: var(--o100);
  --guess-line: var(--o500);

  --low: #C0261B;
  --low-bg: #FCEBE9;
  --amber: var(--o800);
  --amber-bg: var(--o100);

  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "Noto Sans TC", ui-monospace, "SF Mono", Consolas, "Microsoft JhengHei", monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.65 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--o600); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 頂列 ---------- */
.top {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 24px; background: var(--b900); color: #fff;
  border-bottom: 4px solid var(--o500);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font-size: 16px; letter-spacing: .08em; display: flex; align-items: center; gap: 9px; }
.brand b::before { content: ""; width: 10px; height: 18px; background: var(--o500); display: inline-block; }
.brand span { font-size: 14px; color: #BFD3E6; }
.top-mid { color: #BFD3E6; font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
.top-r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.clock { font-size: 12.5px; color: #BFD3E6; margin-right: 6px; }
.top .btn.ghost { color: #fff; border: 1.5px solid #7FA3C6; background: transparent; box-shadow: none; }
.top .btn.ghost:hover:not(:disabled) { background: #fff; color: var(--b900); border-color: #fff; }
.top .btn.ghost:active:not(:disabled) { background: var(--o500); border-color: var(--o500); color: var(--b900); }

/* ---------- 步驟列 ---------- */
.steps {
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--panel); border-bottom: 1px solid var(--line2);
}
.step {
  display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 12px 18px; border: 0; border-right: 1px solid var(--line); background: transparent;
  cursor: pointer; min-height: 58px; position: relative; color: var(--ink);
}
.step:last-child { border-right: 0; }
.step:hover { background: var(--b50); }
.step .n {
  flex: none; width: 26px; height: 26px; display: grid; place-items: center;
  border: 1.5px solid var(--b500); color: var(--b700); font-size: 12.5px; font-weight: 700; background: #fff;
}
.step .t { display: block; font-weight: 700; font-size: 14.5px; line-height: 1.25; }
.step .r { display: block; font-size: 12px; color: var(--mute); line-height: 1.25; }
.step .cnt { margin-left: auto; font-size: 12px; color: var(--b800); border: 1px solid var(--b300); padding: 0 7px; min-width: 24px; text-align: center; background: var(--b50); font-weight: 700; }
.step[aria-current="page"] { background: var(--b100); box-shadow: inset 0 -4px 0 var(--o500); }
.step[aria-current="page"] .n { background: var(--b700); color: #fff; border-color: var(--b700); }
.step[aria-current="page"] .t { color: var(--b900); }
.step[aria-current="page"] .cnt { background: var(--o500); border-color: var(--o500); color: var(--b900); }

/* ---------- 色彩說明 ---------- */
.legend {
  display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
  padding: 8px 24px; font-size: 12.5px; color: var(--mute); border-bottom: 1px solid var(--line); background: #F6F8FA;
}
.legend i { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; border: 1px solid; }
.lg-raw i { background: #fff; border-color: var(--ink); border-left-width: 4px; }
.lg-ai i { background: var(--ai-bg); border-color: var(--ai); }
.lg-human i { background: var(--human); border-color: var(--human); }
.lg-guess i { background: var(--guess-bg); border-color: var(--o700); border-style: dashed; }
.lg-low i { background: var(--low-bg); border-color: var(--low); border-style: dashed; }

/* ---------- 版心 ---------- */
main { max-width: 1320px; margin: 0 auto; padding: 22px 24px 64px; }
.ph { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.ph h1 { font-size: 20px; line-height: 1.3; color: var(--b900); }
.lede { color: var(--mute); margin-bottom: 18px; max-width: 70ch; }
.cols { display: grid; gap: 20px; align-items: start; }
.cols.c-2-1 { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.cols.c-1-1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); }
.cols.c-board { grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); }
.cols.c-reply { grid-template-columns: 280px minmax(0, 1fr); }

.panel { background: var(--panel); border: 1px solid var(--line2); }
.panel > .pb { padding: 16px 18px; }
.ptitle {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 9px 18px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; background: #F6F8FA;
}
.ptitle small { font-weight: 400; color: var(--mute); font-size: 12.5px; }
.sub { font-size: 12.5px; color: var(--mute); }
.stack > * + * { margin-top: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sp { margin-left: auto; }

/* ---------- 標籤 ---------- */
.tag {
  display: inline-block; font-size: 11.5px; line-height: 1.5; padding: 0 6px; border: 1px solid; font-weight: 500; white-space: nowrap;
}
.tag.raw { color: var(--ink); border-color: var(--ink); background: #fff; }
.tag.ai { color: var(--ai-ink); border-color: var(--ai-line); background: var(--ai-bg); }
.tag.human { color: #fff; border-color: var(--human); background: var(--human); }
.tag.guess { color: var(--guess); border-color: var(--o700); background: var(--guess-bg); border-style: dashed; }
.tag.demo { color: var(--mute); border-color: var(--line2); background: transparent; }
.top .tag.demo { color: var(--b900); border-color: var(--o500); background: var(--o500); font-weight: 700; }
.tag.low { color: var(--low); border-color: var(--low); background: var(--low-bg); border-style: dashed; }
.tag.data { color: var(--ink); border-color: var(--line2); background: #EEF1F4; }

/* 來源：LINE 用綠色 */
.src { display: inline-block; font-size: 12px; line-height: 1.6; padding: 0 7px; border: 1px solid var(--line2); color: var(--ink); background: #fff; white-space: nowrap; }
.src.src-line { background: var(--line-g); border-color: var(--line-g); color: #fff; font-weight: 700; }

/* ---------- 按鈕：實心深藍＝主要動作，白底藍框＝次要，灰底虛線＝不能按 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 0 18px; border: 1.5px solid var(--b700); background: #fff; color: var(--b700);
  cursor: pointer; font-weight: 700; border-radius: 3px;
  box-shadow: inset 0 -2px 0 var(--b100);
  transition: background-color .12s, color .12s, border-color .12s, box-shadow .12s;
}
.btn:hover:not(:disabled) { background: var(--b100); border-color: var(--b900); color: var(--b900); box-shadow: inset 0 -2px 0 var(--b300); }
.btn:active:not(:disabled) { background: var(--b300); border-color: var(--b900); color: var(--b900); box-shadow: inset 0 2px 3px rgba(0, 51, 95, .25); transform: translateY(1px); }
.btn.primary { background: var(--b700); border-color: var(--b900); color: #fff; box-shadow: inset 0 -3px 0 var(--b900); }
.btn.primary:hover:not(:disabled) { background: var(--b800); color: #fff; box-shadow: inset 0 -3px 0 #001F3A; }
.btn.primary:active:not(:disabled) { background: var(--b900); color: #fff; box-shadow: inset 0 2px 4px rgba(0, 0, 0, .35); }
.btn.ghost { background: transparent; }
.btn.link { border: 0; background: transparent; text-decoration: underline; text-underline-offset: 3px; padding: 0 4px; min-height: 28px; color: var(--b700); box-shadow: none; font-weight: 500; }
.btn.link:hover:not(:disabled) { background: transparent; color: var(--b900); text-decoration-thickness: 2px; box-shadow: none; }
.btn.link:active:not(:disabled) { background: transparent; box-shadow: none; }
.btn.sm { min-height: 30px; padding: 0 12px; font-size: 13px; }
.btn:disabled, .btn.primary:disabled {
  cursor: not-allowed; background: #E6E9ED; border: 1.5px dashed #A3ACB7; color: #8A939E; font-weight: 500; box-shadow: none;
}
.why { font-size: 12.5px; color: var(--mute); }
.why.warn { color: var(--amber); font-weight: 500; }

.seg { display: inline-flex; border: 1.5px solid var(--b700); background: #fff; flex-wrap: wrap; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg span { display: block; padding: 6px 14px; border-right: 1px solid var(--b300); min-height: 34px; line-height: 22px; color: var(--b800); font-weight: 500; }
.seg label:last-child span { border-right: 0; }
.seg label:hover span { background: var(--b100); }
.seg input:checked + span { background: var(--b700); color: #fff; font-weight: 700; }
.seg input[value="LINE"]:checked + span { background: var(--line-g); color: #fff; }
.seg input:focus-visible + span { outline: 3px solid var(--o600); outline-offset: 2px; }

/* ---------- 表單 ---------- */
label.lb { display: block; font-weight: 700; font-size: 13px; margin-bottom: 4px; }
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; min-height: 36px; padding: 6px 10px; border: 1px solid var(--line2); background: #fff; border-radius: 3px;
}
input:hover, select:hover, textarea:hover { border-color: var(--b500); }
textarea { resize: vertical; line-height: 1.6; }
select { appearance: auto; }
.hint { font-size: 12.5px; color: var(--mute); margin-top: 4px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ---------- 原文 ---------- */
pre.raw {
  margin: 0; padding: 12px 14px; background: var(--raw-bg); border: 1px solid var(--line2); border-left: 4px solid var(--ink);
  font: 14px/1.8 var(--mono); white-space: pre-wrap; word-break: break-word; color: var(--ink);
}
pre.raw mark { background: none; color: inherit; padding: 0 1px; border-bottom: 2px solid var(--ai); }
pre.raw mark.low { border-bottom: 2px dashed var(--low); background: var(--low-bg); }
.kv { display: grid; grid-template-columns: 7.5em 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: 13px; align-items: center; }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; }

/* ---------- 範例按鈕 ---------- */
.samples { display: grid; gap: 8px; }
.sample {
  display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: baseline; text-align: left;
  padding: 9px 12px; border: 1px solid var(--line2); background: #fff; cursor: pointer; border-radius: 3px; color: var(--ink);
}
.sample:hover { background: var(--b50); border-color: var(--b500); }
.sample[aria-pressed="true"] { border-color: var(--b700); background: var(--b50); box-shadow: inset 4px 0 0 var(--o500); }
.sample b { font-size: 13px; color: var(--b800); }
.sample .tx { font-family: var(--mono); font-size: 13px; line-height: 1.5; }
.sample .h { grid-column: 2; font-size: 12px; color: var(--mute); }

/* ---------- 欄位表 ---------- */
table { border-collapse: collapse; width: 100%; }
.fields th, .fields td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.fields th { width: 6.5em; font-weight: 700; white-space: nowrap; }
.fields tr:last-child th, .fields tr:last-child td { border-bottom: 0; }
.fields .fval { min-width: 150px; }
.fields .fnote { font-size: 12.5px; color: var(--mute); }
.frow.low > td, .frow.low > th { background: var(--low-bg); }
.frow.low .fval input, .frow.low .fval select { border: 1.5px dashed var(--low); background: #fff; }
.frow.done .fval input, .frow.done .fval select { border: 1.5px solid var(--human); background: var(--human-bg); font-weight: 700; color: var(--b900); }
.frow.ok .fval input, .frow.ok .fval select { background: var(--ai-bg); border-color: var(--ai-line); }
.conf { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.conf i { display: inline-block; width: 46px; height: 6px; background: #D5DCE4; position: relative; }
.conf i b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ai); }
.frow.low .conf i b { background: var(--low); }
.lowtxt { color: var(--low); font-weight: 700; }

/* ---------- AI／人 區塊 ---------- */
.ai-block { background: var(--ai-bg); border: 1px solid var(--ai-line); border-left: 4px solid var(--ai); color: #0E2C4A; }
.ai-block .ptitle { border-bottom-color: var(--ai-line); background: transparent; }
.ai-block .pb { padding: 12px 16px; }
.ai-block .sub { color: #3A5D84; }
.human-block { background: var(--human-bg); border: 1px solid var(--human); border-left: 5px solid var(--human); color: var(--b900); }
.human-block .sub { color: #3D5574; }
.engine { padding: 8px 12px; font-size: 13px; border: 1px solid var(--ai-line); background: var(--ai-bg); color: #0E2C4A; border-left: 4px solid var(--ai); }
.engine.fallback { border-color: var(--o500); background: var(--o100); color: #5A3500; border-left-color: var(--o700); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip-btn { border: 1.5px solid var(--b700); background: #fff; color: var(--b700); padding: 3px 12px; cursor: pointer; font-size: 13px; font-weight: 700; border-radius: 3px; min-height: 32px; }
.chip-btn:hover { background: var(--b700); color: #fff; }
.chip-btn:active { background: var(--b900); border-color: var(--b900); color: #fff; }
.fu { margin: 0; padding-left: 1.4em; }
.fu li + li { margin-top: 10px; }

/* ---------- 狀態標 ---------- */
.chip { display: inline-block; font-size: 12px; padding: 0 8px; border: 1px solid var(--line2); background: #fff; line-height: 1.7; white-space: nowrap; font-weight: 500; }
.chip.s-draft { border-color: var(--o700); color: var(--o800); background: var(--o100); }
.chip.s-queued { border-color: var(--ai); color: var(--ai-ink); background: var(--ai-bg); }
.chip.s-decided, .chip.s-replied, .chip.s-done { border-color: var(--human); color: #fff; background: var(--human); }
.chip.s-returned { color: var(--mute); }
.pill { display: inline-block; min-width: 2.2em; text-align: center; padding: 0 8px; font-weight: 700; border: 1px solid; line-height: 1.6; }
.pill.l0 { color: var(--b800); border-color: var(--b300); background: #fff; }
.pill.l1 { color: var(--o800); border-color: var(--o500); background: var(--o100); }
.pill.l2 { color: var(--low); border-color: var(--low); background: var(--low-bg); }
.pill.l3 { color: #fff; border-color: var(--low); background: var(--low); }

/* ---------- 單據列表 ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.list button.item { width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 14px; cursor: pointer; display: grid; gap: 3px; color: var(--ink); }
.list button.item:hover { background: var(--b50); }
.list button.item[aria-current="true"] { background: var(--b100); box-shadow: inset 4px 0 0 var(--o500); }
.item .l1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item .l2 { font-family: var(--mono); font-size: 12.5px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 22px 18px; color: var(--mute); border: 1px dashed var(--line2); background: transparent; }

/* ---------- 看板單 ---------- */
.ticket { background: var(--panel); border: 1px solid var(--line2); }
.ticket + .ticket { margin-top: 16px; }
.ticket.focus { border-color: var(--b700); box-shadow: 0 0 0 1px var(--b700), inset 0 4px 0 var(--o500); }
.t-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 16px; border-bottom: 1px solid var(--line); background: #F6F8FA; }
.ticket.focus .t-head { padding-top: 12px; }
.t-head b { font-size: 15px; color: var(--b900); }
.t-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
.t-grid > section { padding: 14px 16px; min-width: 0; }
.t-grid > .t-orig { border-right: 1px solid var(--line); }
.t-grid h4 { font-size: 13px; display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.t-grid .t-ai { background: var(--ai-bg); border-left: 0; color: #0E2C4A; }
.t-ai h4 small { font-weight: 400; color: #3A5D84; }
.mini { font-size: 13px; }
.mini th { width: 5.5em; font-weight: 500; color: var(--mute); text-align: left; padding: 3px 8px 3px 0; white-space: nowrap; }
.mini td { padding: 3px 0; }
.chg { color: var(--b900); font-weight: 700; font-size: 12px; margin-left: 6px; border-bottom: 2px solid var(--b900); }
.arow { display: grid; grid-template-columns: 6em 1fr; gap: 4px 12px; padding: 7px 0; border-bottom: 1px solid var(--ai-line); }
.arow:last-of-type { border-bottom: 0; }
.arow dt { font-weight: 700; font-size: 13px; color: var(--b800); }
.arow dd { margin: 0; }
.fm { font-family: var(--mono); font-size: 12.5px; color: #3A5D84; display: block; margin-top: 2px; }
.t-act { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
details.basis { margin-top: 10px; border-top: 1px solid var(--ai-line); padding-top: 8px; }
details.basis summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--b700); }
details.basis summary:hover { color: var(--b900); text-decoration: underline; }
.basis .fp { margin-top: 8px; color: #3A5D84; }
.cmp { font-size: 12.5px; margin-top: 8px; background: #fff; color: var(--ink); }
.cmp th, .cmp td { padding: 5px 8px; border: 1px solid var(--line); text-align: right; white-space: nowrap; }
.cmp th { background: #EEF1F4; font-weight: 500; text-align: right; }
.cmp td:first-child, .cmp th:first-child { text-align: left; }
.cmp tr.best td { background: var(--ai-bg); font-weight: 700; }
.cmp tr.sel td { background: var(--human-bg); font-weight: 700; color: var(--b900); }
.cmp tr.sel td:first-child { box-shadow: inset 4px 0 0 var(--human); }
.scroll-x { overflow-x: auto; }
.adjust { border-top: 1px dashed var(--line2); padding: 14px 16px; background: #fff; }
.adjust h4 { margin-bottom: 8px; font-size: 13.5px; display: flex; gap: 8px; align-items: center; }
.params { font-size: 12.5px; margin: 8px 0 0; padding-left: 1.2em; }
.params li + li { margin-top: 2px; }

/* ---------- 時間軸 ---------- */
.tl { padding: 12px 14px 14px; background: #fff; }
.tl .day { display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: center; margin-top: 6px; }
.tl .dl { font-size: 12px; color: var(--mute); line-height: 1.3; }
.tl .track { position: relative; height: 30px; background: #F0F3F6; border: 1px solid var(--line); }
.tl .blk {
  position: absolute; top: 2px; bottom: 2px; background: #D3DEEA; border: 1px solid #9DB3CA; overflow: hidden;
  font-size: 11px; line-height: 24px; padding: 0 4px; white-space: nowrap; text-overflow: ellipsis; color: var(--b900);
}
.tl .blk.x { background: var(--o500); border-color: var(--o700); color: #3D2400; font-weight: 700; }
.tl .blk.late { border: 2px solid var(--low); }
.tl .blk.run { background: #B9CBDE; }
.tl .tick { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--b500); pointer-events: none; }
.tl .tick.now { border-left: 2px solid var(--ink); }
.tl .scale { display: grid; grid-template-columns: 62px 1fr; gap: 8px; font-size: 11px; color: var(--mute); }
.tl .scale div { position: relative; height: 14px; }
.tl .scale div span { position: absolute; transform: translateX(-50%); }
.tl-leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--mute); margin-top: 10px; }
.tl-leg i { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-right: 5px; border: 1px solid #9DB3CA; background: #D3DEEA; }
.tl-leg i.x { background: var(--o500); border-color: var(--o700); }
.tl-leg i.late { border: 2px solid var(--low); background: #D3DEEA; }
.sticky { position: sticky; top: 12px; }

/* ---------- 回覆頁 ---------- */
.chips-row { display: flex; gap: 8px; flex-wrap: wrap; }
.status3 { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line2); background: #fff; }
.status3 > div { padding: 8px 12px; border-right: 1px solid var(--line); }
.status3 > div:last-child { border-right: 0; }
.status3 .k { font-size: 12px; color: var(--mute); }
.status3 .v { font-weight: 700; }
.v.good { color: var(--b900); }
.v.bad { color: var(--low); }
.v.mid { color: var(--o800); }
.noreply { border: 1.5px dashed var(--low); padding: 18px; color: var(--low); text-align: center; background: var(--low-bg); }
.cmpdue { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; padding: 10px 14px; background: #fff; border: 1px solid var(--line2); border-top: 3px solid var(--b700); }
.cmpdue .a { font-size: 12px; color: var(--mute); }
.cmpdue .b { font-size: 17px; font-weight: 700; color: var(--b900); }
.cmpdue .b.lowtxt { color: var(--low); }
.cmpdue .ar { color: var(--o700); font-weight: 700; font-size: 18px; }

/* ---------- 指標頁 ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line2); background: var(--panel); border-top: 4px solid var(--b700); }
.kpi { padding: 14px 16px; border-right: 1px solid var(--line); }
.kpi:last-child { border-right: 0; }
.kpi h3 { font-size: 13px; color: var(--mute); font-weight: 500; }
.kpi .big { font-size: 26px; font-weight: 700; line-height: 1.3; margin: 2px 0 6px; color: var(--b900); }
.kpi .big small { font-size: 13px; font-weight: 500; color: var(--mute); margin-left: 4px; }
.kpi dl { margin: 0; font-size: 12.5px; display: grid; grid-template-columns: 5.2em 1fr; gap: 1px 8px; }
.kpi dt { color: var(--mute); }
.kpi dd { margin: 0; }
.audit th, .audit td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 13px; }
.audit th { background: #EEF1F4; font-weight: 500; color: var(--mute); position: sticky; top: 0; }
.audit tbody tr:hover td { background: var(--b50); }
.audit td.t { white-space: nowrap; color: var(--mute); }
.audit .who { white-space: nowrap; }
.footnote { margin-top: 18px; font-size: 12.5px; color: var(--mute); }

/* ---------- 設定側欄 ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0, 31, 58, .45); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 50;
  background: var(--panel); border-left: 4px solid var(--b700); display: flex; flex-direction: column;
}
.drawer header { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line2); background: #F6F8FA; }
.drawer header h2 { font-size: 16px; color: var(--b900); }
.drawer .body { overflow: auto; padding: 4px 18px 18px; flex: 1; }
.drawer footer { padding: 12px 18px; border-top: 1px solid var(--line2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #F6F8FA; }
.sg { padding: 14px 0; border-bottom: 1px solid var(--line); }
.sg:last-child { border-bottom: 0; }
.sg h3 { font-size: 14px; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--b900); }
.sg .sub { margin-bottom: 10px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 4px 12px; align-items: center; padding: 6px 0; }
.srow .nm { font-size: 13.5px; }
.srow .nm small { display: block; color: var(--mute); font-size: 12px; }
.srow.guess { background: var(--guess-bg); border: 1px dashed var(--o700); padding: 6px 10px; margin: 4px 0; }
.srow.locked input { background: #EEF1F4; color: var(--mute); }
.srow input[type=checkbox] { width: 20px; height: 20px; min-height: 0; justify-self: start; accent-color: var(--b700); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- 提示 ---------- */
#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 80;
  background: var(--b900); color: #fff; padding: 10px 16px; max-width: min(92vw, 560px); font-size: 13.5px; border-radius: 3px;
  border-left: 4px solid var(--o500);
  opacity: 0; pointer-events: none; transition: opacity .15s;
}
#toast.on { opacity: 1; }
.busy { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .busy { animation: none; } #toast, .btn { transition: none; } .btn:active:not(:disabled) { transform: none; } }

/* ---------- 窄螢幕 ---------- */
@media (max-width: 1100px) {
  .cols.c-2-1, .cols.c-1-1, .cols.c-board, .cols.c-reply { grid-template-columns: minmax(0, 1fr); }
  .sticky { position: static; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(2) { border-right: 0; }
  .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
}
@media (max-width: 760px) {
  .top, .legend { padding-left: 16px; padding-right: 16px; }
  main { padding: 16px 16px 56px; }
  .steps { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .step { flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px 8px; min-height: 64px; }
  .step .r, .step .cnt { display: none; }
  .step .t { font-size: 12.5px; }
  .t-grid { grid-template-columns: minmax(0, 1fr); }
  .t-grid > .t-orig { border-right: 0; border-bottom: 1px solid var(--line); }
  .fgrid { grid-template-columns: 1fr; }
  .fields, .fields tbody, .fields tr, .fields th, .fields td { display: block; width: 100%; }
  .fields tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .fields th, .fields td { border: 0; padding: 2px 10px; }
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .kpi { border-right: 0; border-bottom: 1px solid var(--line); }
  .status3 { grid-template-columns: 1fr; }
  .status3 > div { border-right: 0; border-bottom: 1px solid var(--line); }
  .cmpdue { grid-template-columns: 1fr; }
  .top-r { margin-left: 0; }
}

</style>

<body>
<header class="top">
  <div class="brand"><b>昇嶺電子</b><span>單一插單入口</span></div>
  <div class="top-mid"><span class="tag demo">Demo</span><span>示意資料，沒有連 LINE，也沒有連 ERP</span></div>
  <div class="top-r">
    <span class="clock" id="clock"></span>
    <button type="button" class="btn ghost sm" data-act="open-settings">設定</button>
    <button type="button" class="btn ghost sm" data-act="reset">重設 Demo</button>
  </div>
</header>
<nav class="steps" id="steps" aria-label="五個步驟"></nav>
<div class="legend" aria-label="顏色說明">
  <span class="lg-raw"><i></i>原文，不改</span>
  <span class="lg-ai"><i></i>AI 產生，只給建議</span>
  <span class="lg-human"><i></i>人確認或決定</span>
  <span class="lg-guess"><i></i>【我猜的】，待確認</span>
  <span class="lg-low"><i></i>低信心，要確認</span>
</div>
<main id="view"></main>
<div id="drawerHost"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* 昇嶺電子 單一插單入口 — 固定程式引擎（解析規則、換線試算、排序、風險）
   原則：相同輸入必得相同結果；不呼叫模型；每個數字附算式。 */
(function (root) {
  'use strict';

  /* ---------- 日期工具（工作日：週一到週六，九月 26 個工作日） ---------- */
  const WD = ['日', '一', '二', '三', '四', '五', '六'];
  const pad = n => String(n).padStart(2, '0');
  const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12, 0, 0); };
  const fmtD = dt => dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
  const addDays = (s, n) => { const dt = parseD(s); dt.setDate(dt.getDate() + n); return fmtD(dt); };
  const dow = s => parseD(s).getDay();
  const md = s => { const dt = parseD(s); return (dt.getMonth() + 1) + '/' + dt.getDate(); };
  const mdw = s => md(s) + '（週' + WD[dow(s)] + '）';
  const hhmm = h => { const t = Math.round(h * 60); return pad(Math.floor(t / 60)) + ':' + pad(t % 60); };
  const nextWork = s => { while (dow(s) === 0) s = addDays(s, 1); return s; };
  const prevWork = s => { while (dow(s) === 0) s = addDays(s, -1); return s; };
  function workdaysBetween(a, b) {
    if (a === b) return 0;
    const dir = a < b ? 1 : -1; let c = a, n = 0, guard = 0;
    while (c !== b && guard++ < 800) { c = addDays(c, dir); if (dow(c) !== 0) n += dir; }
    return n;
  }
  function addWork(s, n) {
    let c = s; const step = n >= 0 ? 1 : -1; let k = Math.abs(n), guard = 0;
    while (k > 0 && guard++ < 800) { c = addDays(c, step); if (dow(c) !== 0) k--; }
    return c;
  }
  const hourOf = t => { const [h, m] = t.split(':').map(Number); return h + (m || 0) / 60; };

  /* ---------- 預設參數 ---------- */
  function defaults() {
    return {
      // 個案資料（唯讀）
      data: {
        rate: 150,                       // SMT 片／正常運轉小時（12 個月實測 149.9–150.1）
        changeoverH: 0.90,               // 機台紀錄，每次換線平均小時
        lines: 4,                        // 九月 4 條 SMT 線
        poolHoursPerDay: (760 + 133) / 26, // 九月（正常運轉 760 h＋換線停機 133 h）÷ 26 個工作日，推算
        penalty: { '乙': 0.02, '丙': 0.01, '甲': 0 }, // 個案合約：乙 2%／天、丙 1%／天、甲無
        sched05: 0.5, actualPerLineDay: 1.28           // 現行排程固定抓 0.5；實際約 1.28 小時／線／天
      },
      // 【我猜的】
      guess: {
        wA: 1.25,            // 甲虛擬權重 %／天（1–1.5）
        maxDelayA: 1,        // 甲最多延後（天）
        slots: ['10:00', '15:00'], // 固定插單時段
        merge: true,         // 同機種合併
        freezeH: 48,         // 凍結小時
        partExtra: 1,        // 換零件額外換線次數
        nCand: 6,            // 比較幾個候選位置
        dayStart: 8,         // 工作日開始時間
        lossLow: 3000, lossMid: 10000 // 罰款損失 低／中 門檻（NT$）
      },
      prices: { A1: 38, B2: 52, C3: 31 },   // 示意單價 NT$／片
      clock: { date: '2026-11-17', time: '10:30' }, // 示意時間
      conf: { threshold: 0.70 }
    };
  }

  /* ---------- 示意資料表 ---------- */
  const TABLES = {
    customers: { '甲': ['客戶甲', '甲客戶', '甲'], '乙': ['客戶乙', '乙客戶', '乙'], '丙': ['客戶丙', '丙客戶', '丙'] },
    models: ['A1', 'B2', 'C3']
  };

  /* ---------- 現行排程（示意） ---------- */
  function seedQueue() {
    return [
      { id: 'Q-01', customer: '乙', model: 'B2', qty: 3300, due: '2026-11-17', running: true },
      { id: 'Q-02', customer: '甲', model: 'A1', qty: 3000, due: '2026-11-18' },
      { id: 'Q-03', customer: '丙', model: 'C3', qty: 1800, due: '2026-11-18' },
      { id: 'Q-04', customer: '乙', model: 'B2', qty: 2400, due: '2026-11-19' },
      { id: 'Q-05', customer: '丙', model: 'C3', qty: 2400, due: '2026-11-19' },
      { id: 'Q-06', customer: '甲', model: 'A1', qty: 3000, due: '2026-11-20' },
      { id: 'Q-07', customer: '乙', model: 'B2', qty: 1200, due: '2026-11-20' }
    ];
  }

  /* ---------- 時間軸：把「合計運轉小時」對到日期與鐘點 ---------- */
  function makeCal(asOfDate, P) {
    const Hday = P.data.poolHoursPerDay, L = Hday / P.data.lines, ds = P.guess.dayStart;
    const base = nextWork(asOfDate);
    const cal = {
      base, Hday, L, ds,
      pos(date, hour) {
        const d = dow(date) === 0 ? prevWork(date) : date;
        const idx = workdaysBetween(base, d);
        const frac = Math.min(1, Math.max(0, (hour - ds) / L));
        return idx * Hday + frac * Hday;
      },
      dueEnd(date) { return cal.pos(date, ds + L); },
      at(p) {
        const idx = Math.floor(p / Hday + 1e-9);
        const frac = Math.min(1, Math.max(0, (p - idx * Hday) / Hday));
        const date = addWork(base, idx), hour = ds + frac * L;
        return { date, hour, label: md(date) + ' ' + hhmm(hour) };
      },
      atEnd(p) { return cal.at(p - 1e-7); },
      slotHours() { return P.guess.slots.map(hourOf).sort((a, b) => a - b); }
    };
    return cal;
  }

  /* ---------- 排程計算 ---------- */
  function weightOf(job, P) {
    const rate = job.customer === '甲' ? P.guess.wA / 100 : (P.data.penalty[job.customer] || 0);
    return { rate, perDay: job.qty * (P.prices[job.model] || 0) * rate };
  }

  function runSeq(seq, p0, P, cal) {
    let p = p0, prev = null; const out = [];
    seq.forEach((j, i) => {
      let c = 0;
      if (i > 0) c = (P.guess.merge ? (prev.model !== j.model ? 1 : 0) : 1) + (j.partChange ? P.guess.partExtra : 0);
      if (j.notBefore != null && p < j.notBefore) p = j.notBefore;
      const run = j.qty / P.data.rate, co = c * P.data.changeoverH;
      const start = p, end = p + run + co;
      const w = weightOf(j, P), amount = j.qty * (P.prices[j.model] || 0);
      const dueEnd = cal.dueEnd(j.due);
      const late = Math.max(0, Math.ceil((end - dueEnd) / cal.Hday - 1e-9));
      out.push({ job: j, start, end, run, co, c, amount, rate: w.rate, perDay: w.perDay, dueEnd, late, loss: w.perDay * late });
      p = end; prev = j;
    });
    return out;
  }
  const totalLoss = rows => rows.reduce((a, r) => a + r.loss, 0);
  const totalC = rows => rows.reduce((a, r) => a + r.c, 0);

  function fnv(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
    return h.toString(16).padStart(8, '0');
  }

  /* ---------- 試算：找最佳插單位置 ---------- */
  function calc(queue, X, P, asOf) {
    const cal = makeCal(asOf.date, P);
    const asOfDate = dow(asOf.date) === 0 ? nextWork(asOf.date) : asOf.date;
    const asOfHour = dow(asOf.date) === 0 ? P.guess.dayStart : asOf.hour;
    const p0 = cal.pos(asOfDate, asOfHour);
    const base = runSeq(queue, p0, P, cal);
    const baseLoss = totalLoss(base), baseC = totalC(base);

    // 排入時段：asOf 之後最近的固定時段
    const sh = cal.slotHours();
    let entryDate = asOfDate, entryHour = null;
    for (const h of sh) if (h >= asOfHour - 1e-9) { entryHour = h; break; }
    if (entryHour == null) { entryDate = addWork(asOfDate, 1); entryHour = sh[0]; }
    const entryPos = cal.pos(entryDate, entryHour);
    const entry = { date: entryDate, hour: entryHour, pos: entryPos,
      label: (entryDate === asOfDate ? '今天 ' : md(entryDate) + ' ') + hhmm(entryHour) };

    // 凍結：asOf + freezeH 之前開工的單不重排
    const fd = Math.floor(P.guess.freezeH / 24), fr = P.guess.freezeH % 24;
    let fHour = asOfHour + fr, fDate = addDays(asOfDate, fd);
    if (fHour >= 24) { fHour -= 24; fDate = addDays(fDate, 1); }
    const frozenUntil = cal.pos(fDate, Math.min(fHour, P.guess.dayStart + cal.L));
    const frozen = new Set(base.filter(r => r.start < frozenUntil - 1e-9).map(r => r.job.id));

    const Xjob = Object.assign({}, X, { inserted: true });
    const cands = [];
    const eligible = [];
    for (let k = 1; k <= queue.length; k++) {
      const start = base[k - 1].end;
      if (start >= entryPos - 1e-9) eligible.push(k);
    }
    if (!eligible.length) eligible.push(queue.length);

    eligible.slice(0, P.guess.nCand).forEach(k => {
      const mk = jobs => runSeq(jobs, p0, P, cal);
      const xj = Object.assign({}, Xjob, { notBefore: entryPos });
      const seqA = [...queue.slice(0, k), xj, ...queue.slice(k)];
      const rowsA = mk(seqA);
      let rows = rowsA, resorted = false;
      const after = seqA.slice(k + 1);
      const frozenPart = after.filter(j => frozen.has(j.id));
      const freeTail = after.filter(j => !frozen.has(j.id));
      if (freeTail.length > 1) {
        const lateIn = new Set(rowsA.filter(r => r.late > 0).map(r => r.job.id));
        const idx = new Map(freeTail.map((j, i) => [j.id, i]));
        const sorted = [...freeTail].sort((a, b) => {
          const la = lateIn.has(a.id) ? 1 : 0, lb = lateIn.has(b.id) ? 1 : 0;
          if (la !== lb) return lb - la;
          const wa = weightOf(a, P).perDay, wb = weightOf(b, P).perDay;
          if (Math.abs(wa - wb) > 1e-9) return wb - wa;
          return idx.get(a.id) - idx.get(b.id);
        });
        const changed = sorted.some((j, i) => j.id !== freeTail[i].id);
        if (changed) {
          const seqB = [...seqA.slice(0, k + 1), ...frozenPart, ...sorted];
          const rowsB = mk(seqB);
          if (totalLoss(rowsB) < totalLoss(rowsA) - 1) { rows = rowsB; resorted = true; }
        }
      }
      const xr = rows.find(r => r.job.id === X.id);
      const xi = rows.indexOf(xr);
      const prevJob = xi > 0 ? rows[xi - 1].job : null;
      const nextRow = rows[xi + 1] || null;
      const baseNext = nextRow ? base.find(r => r.job.id === nextRow.job.id) : null;
      const newLate = rows.filter(r => r.job.id !== X.id && r.late > 0 &&
        !(base.find(b => b.job.id === r.job.id && b.late >= r.late)))
        .map(r => ({ id: r.job.id, customer: r.job.customer, model: r.job.model, qty: r.job.qty,
          late: r.late, loss: r.loss - ((base.find(b => b.job.id === r.job.id) || {}).loss || 0) }));
      const aLate = rows.filter(r => r.job.customer === '甲' && r.late > P.guess.maxDelayA)
        .map(r => ({ id: r.job.id, late: r.late }));
      const tl = totalLoss(rows);
      const extraC = totalC(rows) - baseC;
      const sameModelAdj = !!(prevJob && prevJob.model === X.model) || !!(nextRow && nextRow.job.model === X.model);
      cands.push({
        k, afterId: queue[k - 1].id, after: queue[k - 1],
        x: xr, start: xr.start, end: xr.end,
        startAt: cal.at(xr.start), endAt: cal.atEnd(xr.end),
        lateX: xr.late, lossX: xr.loss, totalLoss: tl, deltaLoss: tl - baseLoss,
        newLate, aLate, extraC, extraH: extraC * P.data.changeoverH,
        cX: xr.c, cNextOld: baseNext ? baseNext.c : 0, cNextNew: nextRow ? nextRow.c : 0,
        sameModelAdj, resorted, rows,
        seqJobs: rows.map(r => r.job)
      });
    });

    let best = 0;
    cands.forEach((c, i) => {
      const b = cands[best];
      if (c.totalLoss < b.totalLoss - 1e-6 ||

    const fingerprint = fnv(JSON.stringify({ queue: queue.map(q => [q.id, q.customer, q.model, q.qty, q.due, q.partChange || 0]),
      X: [X.customer, X.model, X.qty, X.due, X.partChange || 0], P: { g: P.guess, d: P.data, p: P.prices }, asOf: [asOfDate, asOfHour] }));

    return { cal, asOf: { date: asOfDate, hour: asOfHour, label: md(asOfDate) + ' ' + hhmm(asOfHour) },

      cands, best, fingerprint,

  }

  /* ---------- 風險與等級 ---------- */
  function risk(c, cal, P) {
    const dueEnd = c.x.dueEnd;
    const slackDays = (dueEnd - c.end) / cal.Hday;
    let level = 0; const why = [];
    if (c.lateX > 0) { level = 2; why.push('本單預計晚 ' + c.lateX + ' 天'); }
    else if (slackDays < 0.5) { level = 1; why.push('餘裕只有 ' + slackDays.toFixed(1) + ' 天'); }
    else why.push('餘裕 ' + slackDays.toFixed(1) + ' 天');
    if (c.newLate.length) { level = Math.max(level, 1); why.push('連帶 ' + c.newLate.length + ' 張變遲'); }

  /* ---------- 規則解析 ---------- */
  const zhDigit = { '零': 0, '〇': 0, '一': 1, '二': 2, '兩': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  const zhUnit = { '十': 10, '百': 100, '千': 1000 };
  function zhNum(s) {
    let total = 0, cur = 0, last = 0;
    for (const ch of s) {
      if (ch in zhDigit) cur = zhDigit[ch];

  }
  const wkMap = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 0, '天': 0 };

  function ruleParse(text, ctx) {
    const P = ctx.P, today = ctx.today;
    const F = {};
    const none = note => ({ value: null, conf: 0, span: null, note, src: 'rule' });

    // 客戶
    F.customer = none('原文找不到客戶');
    let best = null;
    for (const [name, aliases] of Object.entries(TABLES.customers)) {
      for (const a of aliases) {
        const i = text.indexOf(a);
        if (i >= 0 && (!best || i < best.i)) best = { name, i, len: a.length };

    if (best) F.customer = { value: best.name, conf: 0.95, span: [best.i, best.i + best.len], note: '對照客戶別名表', src: 'rule' };

    while ((m = mre.exec(text))) {
      const code = (m[1] + m[2]).toUpperCase();
      if (TABLES.models.includes(code)) { F.model = { value: code, conf: 0.95, span: [m.index, m.index + m[0].length], note: '對照機種表', src: 'rule' }; firstTok = null; break; }

    F.qty = none('原文沒有數量');
    const q1 = /(\d[\d,]{0,6})\s*(片|PCS|pcs|Pcs|pc|PC|個)/.exec(text);
    const q2 = /([零〇一二兩三四五六七八九十百千]{1,8})\s*(片|個)/.exec(text);
    if (q1) F.qty = { value: parseInt(q1[1].replace(/,/g, ''), 10), conf: 0.95, span: [q1.index, q1.index + q1[0].length], note: '數字加單位', src: 'rule' };
    else if (q2 && zhNum(q2[1]) > 0) F.qty = { value: zhNum(q2[1]), conf: 0.85, span: [q2.index, q2.index + q2[0].length], note: '中文數字換算', src: 'rule' };

    // 要求交期
    F.due = none('原文沒有交期');
    const dateRe = /(\d{1,2})\s*[\/月]\s*(\d{1,2})\s*[日號]?/.exec(text);
    const wkRe = /(下|下個|這|本)?\s*(週|周|禮拜|星期)\s*([一二三四五六日天])/.exec(text);
    const relRe = /(今天|今日|明天|明日|大後天|後天)/.exec(text);
    const y = parseInt(today.slice(0, 4), 10);
    if (dateRe) {
      const mm = +dateRe[1], dd = +dateRe[2];
      const ok = mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31;
      if (ok) F.due = { value: y + '-' + pad(mm) + '-' + pad(dd), conf: 0.95, span: [dateRe.index, dateRe.index + dateRe[0].length], note: '明確日期', src: 'rule' };
    } else if (wkRe) {
      const t = wkMap[wkRe[3]], pre = wkRe[1] || '';
      const dt = dow(today), monday = addDays(today, -((dt + 6) % 7));
      const thisW = addDays(monday, (t + 6) % 7), nextW = addDays(thisW, 7);
      const thisOk = thisW > today;
      if (pre.startsWith('下')) F.due = { value: nextW, conf: 0.85, span: [wkRe.index, wkRe.index + wkRe[0].length], note: '「下週」推算', src: 'rule' };
      else if (pre === '這' || pre === '本') F.due = { value: thisOk ? thisW : nextW, conf: 0.9, span: [wkRe.index, wkRe.index + wkRe[0].length], note: '「本週」推算', src: 'rule' };
      else {
        const v = thisOk ? thisW : nextW, alt = thisOk ? nextW : addDays(nextW, 7);
        F.due = { value: v, conf: 0.55, span: [wkRe.index, wkRe.index + wkRe[0].length], note: '只說星期幾，不知是這週或下週', src: 'rule',
          alts: [{ value: v, label: mdw(v) + '（最近的一個）' }, { value: alt, label: mdw(alt) }] };
      }
    } else if (relRe) {
      const k = { '今天': 0, '今日': 0, '明天': 1, '明日': 1, '後天': 2, '大後天': 3 }[relRe[1]];
      F.due = { value: addDays(today, k), conf: 0.85, span: [relRe.index, relRe.index + relRe[0].length], note: '由「' + relRe[1] + '」推算', src: 'rule' };
    } else if (/(盡快|越快越好|愈快愈好|急)/.test(text)) {
      F.due = none('只說盡快，沒有日期');
    }

    // 是否換零件
    F.partChange = none('原文沒提零件');
    const neg = /(不(用)?(必)?換(零件|料)|零件(不變|沒變|不換|不改|同)|沒有?換(零件|料)|同(零件|料))/.exec(text);
    const pos = /((換|改)(了)?(零件|料)|零件(有)?(換|改|變)|新版|改版)/.exec(text);
    if (neg) F.partChange = { value: false, conf: 0.9, span: [neg.index, neg.index + neg[0].length], note: '原文說零件不變', src: 'rule' };
    else if (pos) F.partChange = { value: true, conf: 0.9, span: [pos.index, pos.index + pos[0].length], note: '原文說要換零件', src: 'rule' };

    // 是否追加單
    const add = /(追加|加單|插單|急單|加急|插一張|加一張|再加|加\s*\d)/.exec(text);
    F.isAdd = add ? { value: true, conf: 0.9, span: [add.index, add.index + add[0].length], note: '原文有追加用語', src: 'rule' }
      : { value: false, conf: 0.6, span: null, note: '原文沒提，暫當一般單', src: 'rule' };
    return F;
  }

  /* ---------- 模型回傳的驗證：每個值都要在原文找得到出處 ---------- */
  function validateModelOutput(text, obj, ctx) {
    const out = {}; const issues = [];
    if (!obj || typeof obj !== 'object') return { fields: null, issues: ['回傳不是物件'] };
    const get = k => (obj[k] && typeof obj[k] === 'object') ? obj[k] : null;
    const evSpan = ev => { if (!ev || typeof ev !== 'string') return null; const i = text.indexOf(ev); return i >= 0 ? [i, i + ev.length] : null; };
    const C = x => { const n = Number(x); return isFinite(n) ? Math.max(0, Math.min(1, n)) : 0.5; };
    const one = (k, norm) => {
      const o = get(k);
      if (!o || o.value == null || o.value === '') { out[k] = { value: null, conf: 0, span: null, note: '模型沒找到', src: 'llm' }; return; }
      const v = norm(o.value);
      const span = evSpan(o.evidence);
      if (v == null) { out[k] = { value: null, conf: 0, span: null, note: '模型值無法使用', src: 'llm' }; issues.push(k + ' 值無效'); return; }
      if (!span && k !== 'isAdd' && k !== 'partChange') { out[k] = { value: null, conf: 0, span: null, note: '模型值在原文找不到出處，已丟棄', src: 'llm' }; issues.push(k + ' 無出處'); return; }
      let conf = C(o.confidence); if (!span) conf = Math.min(conf, 0.6);
      out[k] = { value: v, conf, span, note: (o.note && String(o.note).slice(0, 40)) || '模型解析', src: 'llm' };
      if (Array.isArray(o.alternatives)) {
        const alts = o.alternatives.map(a => norm(a)).filter(Boolean);
        if (alts.length) out[k].alts = alts.map(a => ({ value: a, label: k === 'due' ? mdw(a) : String(a) }));
      }
    };
    one('customer', v => Object.keys(TABLES.customers).includes(String(v)) ? String(v) : null);
    one('model', v => { const s = String(v).toUpperCase().replace(/[\s-]/g, ''); return /^[A-Z]\d{1,3}$/.test(s) ? s : null; });
    one('qty', v => { const n = Math.round(Number(String(v).replace(/,/g, ''))); return n > 0 && n < 1000000 ? n : null; });
    one('due', v => /^\d{4}-\d{2}-\d{2}$/.test(String(v)) && !isNaN(parseD(String(v))) ? String(v) : null);
    one('partChange', v => (v === true || v === 'true' || v === '是' || v === '要') ? true : (v === false || v === 'false' || v === '否' || v === '不') ? false : null);
    one('isAdd', v => (v === true || v === 'true' || v === '是') ? true : (v === false || v === 'false' || v === '否') ? false : null);
    if (out.model && out.model.value && !TABLES.models.includes(out.model.value)) { out.model.conf = Math.min(out.model.conf, 0.5); out.model.note = '機種不在對照表'; }
    return { fields: out, issues };
  }

  /* 規則與模型合併：不一致就降信心，讓業務看到 */
  function mergeParse(rule, llm) {
    const out = {};
    for (const k of Object.keys(rule)) {

      if (!l || l.value == null) { out[k] = Object.assign({}, r, { src: r.value == null ? 'none' : 'rule' }); continue; }

        out[k] = Object.assign({}, l, { conf: amb ? r.conf : (Math.max(l.conf, r.conf) >= 0.95 ? 0.97 : Math.max(l.conf, r.conf)), note: amb ? r.note : '模型與規則一致', alts: amb ? r.alts : (l.alts || r.alts), span: l.span || r.span });

      out[k] = Object.assign({}, l, { conf: Math.min(l.conf, r.conf, 0.6), note: '模型與規則不一致（規則：' + r.value + '）', alts: [{ value: r.value, label: String(r.value) + '（規則）' }, { value: l.value, label: String(l.value) + '（模型）' }] });

  const FIELD_ORDER = ['customer', 'model', 'qty', 'due', 'partChange', 'isAdd'];
  const FIELD_LABEL = { customer: '客戶', model: '機種', qty: '數量', due: '要求交期', partChange: '是否換零件', isAdd: '是否追加單' };

  /* ---------- 回覆草稿（固定範本；模型只可改措辭） ---------- */
  function replyDraft(order, dueDate, requested) {
    const f = order.fields; const q = f.qty.value.toLocaleString('en-US');

    if (dueDate <= requested) return head + '，預計 ' + mdw(dueDate) + ' 可出貨，符合您要求的 ' + mdw(requested) + '。如有變動我們會先通知您。';
    return head + '，目前排程最快 ' + mdw(dueDate) + ' 出貨，趕不上您要求的 ' + mdw(requested) + '。若要更早，我們需要再與生管確認，確認後回覆您。';

<script>
/* 昇嶺電子 單一插單入口 Demo — 畫面與流程。引擎在 engine.js。 */
(function () {
  'use strict';
  const E = window.Engine, U = E.util;

  /* ===== AI 解析設定（換模型改這裡，或到「設定」改） =====

  const AI_CONFIG_DEFAULT = { mode: 'cloud', modelTier: 'quick', model: '', timeoutMs: 8000 };

  const SAMPLES = [
    { key: 'full', label: '完整', text: '甲客戶追加 A1 800片，11/20 要出貨，零件有換。', boss: '09:10', hint: '五個欄位原文都有' },
    { key: 'noqty', label: '缺數量', text: '乙那邊要插一張 B2，11/20 要，零件不變', boss: '09:42', hint: '沒寫數量，要追問；補 2,400 片可看到連帶變遲的例子' },
    { key: 'vague', label: '交期模糊', text: '丙的 C3 加 600片，週四要，零件不變', boss: '10:05', hint: '「週四」是這週還是下週？可兩種都選來比較' }
  ];
  const PAGES = [
    { k: 'intake', t: '收單', r: '業務' },

    { k: 'board', t: '生管看板', r: '生管' },

  const $ = (s, r) => (r || document).querySelector(s);

  /* ===== 時間與稽核 ===== */

  /* ===== AI 解析（模型為主，失敗退回規則） ===== */
  function buildPrompt(text) {
    const st = nowStamp();
    return '你是工廠插單文字的欄位抽取器。只做抽取，不要猜，不要補資料。\n' +
      '今天是 ' + st.date + '（週' + U.WD[U.dow(st.date)] + '）。客戶只有 甲、乙、丙。\n' +
      '原文（三個角括號之間）：\n<<<' + text + '>>>\n\n' +
      '只回傳一個 JSON，不要說明、不要程式碼框。格式：\n' +
      '{"customer":{"value":"甲|乙|丙|null","evidence":"原文片段","confidence":0到1},' +
      '"model":{"value":"機種代碼，如A1","evidence":"","confidence":0},' +
      '"qty":{"value":整數片數或null,"evidence":"","confidence":0},' +
      '"due":{"value":"YYYY-MM-DD或null","evidence":"","confidence":0,"alternatives":["YYYY-MM-DD"]},' +
      '"partChange":{"value":true|false|null,"evidence":"","confidence":0},' +
      '"isAdd":{"value":true|false|null,"evidence":"","confidence":0}}\n' +
      '規則：evidence 必須是原文裡一字不差的片段；原文沒寫就把 value 設 null，不可推測；' +
      '只說星期幾而沒說哪一週時，confidence 不可高於 0.6，並把另一週的日期放進 alternatives。';
  }
  function extractJSON(t) {
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0 || b < a) throw new Error('回傳不是 JSON');
    return JSON.parse(t.slice(a, b + 1));
  }
  async function askModel(prompt, signalMs) {
    const sample = (window.claude && window.claude.use) ? await window.claude.use('sample') : null;
    if (!sample) throw new Error('此環境沒有雲端模型');
    const ac = new AbortController();
    const opts = { signal: ac.signal, cache: false, modelTier: S.ai.modelTier || 'quick' };
    if (S.ai.model) opts.model = S.ai.model;
    let timer;
    const timeout = new Promise((_, rej) => { timer = setTimeout(() => { ac.abort(); rej(new Error('逾時')); }, signalMs); });
    try { return await Promise.race([sample(prompt, opts), timeout]); } finally { clearTimeout(timer); }
  }
  async function parseEngine(text) {
    const ctx = { P: S.P, today: nowStamp().date };
    const rule = E.ruleParse(text, ctx);
    const cfg = S.ai, ms = cfg.timeoutMs || 8000;
    const fallback = why => ({ fields: rule, engine: 'rule', fallback: true, status: '規則解析（雲端模型' + why + '，已退回規則）' });
    if (cfg.mode === 'rule') return { fields: rule, engine: 'rule', fallback: false, status: '規則解析（設定為固定使用規則）' };
    const t0 = performance.now();
    try {
      if (cfg.mode === 'sim-fail') { await sleep(400); throw new Error('模擬呼叫失敗'); }
      if (cfg.mode === 'sim-timeout') { await sleep(ms); throw new Error('逾時'); }
      const res = await askModel(buildPrompt(text), ms);
      const v = E.validateModelOutput(text, extractJSON(res.text || ''), ctx);
      if (!v.fields) throw new Error('格式不符');
      const merged = E.mergeParse(rule, v.fields);
      const sec = ((performance.now() - t0) / 1000).toFixed(1);
      return { fields: merged, engine: 'cloud', fallback: false, issues: v.issues, status: '雲端模型（' + (cfg.model || cfg.modelTier) + '）解析，' + sec + ' 秒，已與規則比對' + (v.issues.length ? '；丟棄 ' + v.issues.length + ' 個沒有出處的值' : '') };
    } catch (e) {
      const m = String(e && (e.message || e.code) || e);
      let why = '呼叫失敗（' + m.slice(0, 24) + '）';
      if (/逾時/.test(m)) why = '超過 ' + (ms / 1000) + ' 秒';
      else if (/沒有雲端模型|not_granted/.test(m)) why = '未啟用';
      else if (/模擬/.test(m)) why = '模擬失敗';
      return fallback(why);
    }
  }

  /* ===== 追問 ===== */
  function lowOf(o, k) {
    const f = o.draft.fields[k];
    if (f.value == null || f.value === '') return 'missing';
    if (f.confirmed) return null;
    if (k === 'model' && !E.TABLES.models.includes(f.value)) return 'low';
    return f.conf < S.P.conf.threshold ? 'low' : null;
  }
  function pendingFields(o) {
    return [...REQ, 'isAdd'].map(k => ({ k, why: lowOf(o, k) })).filter(x => x.why);
  }
  function followups(o) {
    return pendingFields(o).map(({ k, why }) => {
      const f = o.draft.fields[k]; let text = '', chips = [];
      if (k === 'customer') { text = why === 'missing' ? '客戶是哪一家？' : '客戶是「' + f.value + '」嗎？'; chips = Object.keys(E.TABLES.customers).map(c => ({ v: c, l: c })); }
      if (k === 'model') { text = why === 'missing' ? '機種代碼是什麼？' : '機種「' + f.value + '」不在對照表，是哪一個？'; chips = E.TABLES.models.map(c => ({ v: c, l: c })); }
      if (k === 'qty') { text = '數量缺：這張要幾片？請直接填在右邊的數量欄。'; }
      if (k === 'due') {
        if (why === 'missing') text = '客戶要幾號出貨？請在要求交期欄選日期。';
        else { text = '「' + (f.span ? o.raw.text.slice(f.span[0], f.span[1]) : '交期') + '」是哪一天？'; chips = (f.alts || [{ value: f.value, label: U.mdw(f.value) }]).map(a => ({ v: a.value, l: a.label })); }
      }
      if (k === 'partChange') { text = '這張要換零件嗎？原文沒有講。'; chips = [{ v: 'true', l: '要換' }, { v: 'false', l: '不換' }]; }
      if (k === 'isAdd') { text = '這是追加單還是一般單？'; chips = [{ v: 'true', l: '追加單' }, { v: 'false', l: '一般單' }]; }
      return { k, why, text, chips };
    });
  }
  function coerce(k, v) {
    if (v === '' || v == null) return null;
    if (k === 'qty') { const n = parseInt(String(v).replace(/,/g, ''), 10); return n > 0 ? n : null; }
    if (k === 'partChange' || k === 'isAdd') return v === true || v === 'true';
    return v;
  }
  function setField(o, k, raw) {
    const f = o.draft.fields[k]; const v = coerce(k, raw);
    f.value = v; f.confirmed = v != null;
  }
  function changesOf(o) {
    const out = [];
    for (const k of E.FIELD_ORDER) {
      const a = o.parse.fields[k].value, b = o.draft.fields[k].value;
      if (String(a) !== String(b)) out.push({ field: k, from: a, to: b });
    }
    return out;
  }

  /* ===== 動作 ===== */
  function go(p) { S.page = p; render(); window.scrollTo(0, 0); }
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 3200);
  }

  async function doParse() {
    const it = S.intake; const text = it.text;
    if (!text.trim() || S.busy) return;
    S.busy = true; render();
    const res = await parseEngine(text);
    S.busy = false;
    const id = 'A-' + pad4(++S.oseq);
    const st = log('業務', '貼上原文', id, '來源 ' + SRC[it.source] + '，' + text.length + ' 字');
    const sample = it.sample && SAMPLES.find(s => s.key === it.sample && s.text === text);
    const o = {
      id, status: 'draft', sample: sample ? sample.label : null,
      raw: Object.freeze({ text, source: it.source, bossLabel: it.boss ? U.md(S.P.clock.date) + ' ' + it.boss : '', bossHM: it.boss || '', receivedAt: st.label }),
      parse: { engine: res.engine, fallback: res.fallback, status: res.status, fields: clone(res.fields) },
      draft: { fields: clone(res.fields) }, calcs: [], decision: null, reply: null, actual: null
    };
    for (const k of E.FIELD_ORDER) o.draft.fields[k].confirmed = false;
    S.orders.unshift(o);
    S.ui.lastEngine = res.status; S.ui.confirmId = id; delete S.ui.follow[id];
    log('AI', '解析欄位', id, res.status);
    S.intake = { text: '', source: it.source, boss: '', sample: null };
    S.page = 'confirm'; render(); window.scrollTo(0, 0);
  }

  function doSubmit(o) {
    if (pendingFields(o).length) return;
    const chg = changesOf(o);
    const st = log('業務', '確認並送出', o.id, chg.length ? '修改欄位：' + chg.map(c => E.FIELD_LABEL[c.field] + ' ' + showVal(c.field, c.from) + ' → ' + showVal(c.field, c.to)).join('；') : '沒有修改欄位');
    o.confirm = { by: '業務', at: st.label, changes: chg };
    o.status = 'queued';
    const c = runCalc(o, '首次試算');
    const b = c.result.cands[c.result.best];
    log('系統', '試算完成', o.id, calcRef(c) + '；建議排在 ' + b.afterId + ' 之後，額外換線 ' + b.extraC + ' 次');
    S.ui.focus = o.id; S.ui.replyId = o.id;
    toast(o.id + ' 已送出，試算 ' + calcRef(c) + ' 完成');
    go('board');
  }

  function doReturn(o) {
    o.status = 'returned';
    log('業務', '退回', o.id, '原文保留，欄位草稿作廢');
    S.page = 'intake'; render(); window.scrollTo(0, 0);
  }

  function decide(o, type) {
    const calc = latestCalc(o), r = calc.result;
    let c;
    if (type === 'adopt') c = r.cands[r.best];
    else {
      const adj = S.ui.adj[o.id] || {};
      c = r.cands.find(x => x.k === adj.k) || r.cands[r.best];
      const reason = (S.ui.reason[o.id] || '').trim();
      if (reason.length < 4) return;
    }
    const reason = type === 'adjust' ? (S.ui.reason[o.id] || '').trim() : '';
    const rk = E.risk(c, r.cal, calc.P);
    const st = log('生管', type === 'adopt' ? '採用 AI 建議' : '調整', o.id,
      '依據 ' + calcRef(calc) + '；排在 ' + c.afterId + ' 之後，' + c.startAt.label + ' 開工' + (type === 'adjust' ? '；原因：' + reason : ''));
    o.decision = {
      type, k: c.k, afterId: c.afterId, reason, by: '生管', at: st.label, calc: calcRef(calc),
      actualSlot: c.startAt.label + ' 開工（' + r.entry.label + ' 排入）',
      est: { extraC: c.extraC, extraH: c.extraH, endDate: c.endAt.date, endLabel: c.endAt.label, lateX: c.lateX, risk: rk.label, startLabel: c.startAt.label }
    };
    o.status = 'decided';
    S.queue = c.seqJobs.map(j => { const n = Object.assign({}, j); delete n.notBefore; delete n.inserted; if (j.id === o.id) n.fromOrder = true; return n; });
    delete S.ui.adj[o.id];
    recalcPending('佇列已變動：' + o.id + ' 已插入');
    S.ui.replyId = o.id; S.ui.focus = o.id;
    toast(o.id + ' 生管已' + (type === 'adopt' ? '採用' : '調整') + '，已寫進稽核紀錄');
    render();
  }

  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch (e) { /* fall through */ }
    try {
      const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  async function doCopy(o) {
    const calc = latestCalc(o);
    if (!calc) return;
    const d = replyInfo(o);
    const text = S.ui.replyText[o.id] != null ? S.ui.replyText[o.id] : d.draft;
    const ok = await copyText(text);
    const st = log('業務', '複製回覆', o.id, '交期 ' + U.mdw(d.dueDate) + '，對應試算 ' + calcRef(calc) + (ok ? '' : '（瀏覽器擋住複製，需手動選取）'));

    if (o.status === 'queued' || o.status === 'decided') o.status = 'replied';
    toast(ok ? '已複製。回覆紀錄：' + U.mdw(d.dueDate) + '，試算 ' + calcRef(calc) : '瀏覽器不讓程式複製，請在草稿框手動選取複製。回覆紀錄已留下。');
    render();
  }

  function sampleActual(o) {
    const idx = S.orders.filter(x => x.status !== 'returned').indexOf(o);
    const f = [1.17, 0.88, 1.31][((idx % 3) + 3) % 3];
    const est = o.decision ? o.decision.est : { extraH: 0, extraC: 0 };
    const hours = Math.round(est.extraH * f * 100) / 100;
    return { shipDate: o.reply ? o.reply.dueDate : dueOf(o), changeovers: Math.round(hours / S.P.data.changeoverH), hours };
  }
  function saveActual(o, a, isSample) {
    const st = log('業務', '回填實際結果', o.id, '實際出貨 ' + U.mdw(a.shipDate) + '；額外換線 ' + a.changeovers + ' 次 / ' + a.hours + ' h' + (isSample ? '（示意數字）' : ''));
    o.actual = Object.assign({ at: st.label, sample: !!isSample }, a);
    o.status = 'done';

  }

  /* ===== 設定 ===== */
  const GUESS_FIELDS = [
    ['guess.wA', '甲的虛擬權重（%／天）', '範圍 1–1.5，需老闆確認', 'number', { step: 0.05, min: 0, max: 10 }],
    ['guess.maxDelayA', '甲最多延後（天）', '超過就交老闆決定', 'number', { step: 1, min: 0, max: 10 }],
    ['guess.slot1', '固定插單時段 1', '新單只在固定時段排入', 'time'],
    ['guess.slot2', '固定插單時段 2', '留空表示只用一個時段', 'time'],
    ['guess.merge', '同機種合併', '相鄰同機種免一次換線', 'check'],
    ['guess.freezeH', '凍結（小時）', '這段時間內已排好的單不重排', 'number', { step: 1, min: 0, max: 240 }],
    ['guess.partExtra', '換零件額外換線（次）', '', 'number', { step: 1, min: 0, max: 3 }],
    ['guess.nCand', '比較幾個插入位置', '', 'number', { step: 1, min: 2, max: 8 }],
    ['guess.dayStart', '工作日開始（點）', '一天長度由九月資料推算', 'number', { step: 0.5, min: 5, max: 11 }],
    ['guess.lossLow', '罰款「低」上限（NT$）', '示意門檻', 'number', { step: 500, min: 0 }],

  function getByPath(path) {
    if (path === 'guess.slot1') return S.P.guess.slots[0] || '';
    if (path === 'guess.slot2') return S.P.guess.slots[1] || '';
    const [a, b] = path.split('.'); return S.P[a][b];
  }
  function readDrawer() {
    const val = id => { const el = $('#' + id); return el; };
    const out = { guess: {}, prices: {}, clock: {}, ai: {}, pending: {} };
    GUESS_FIELDS.forEach(f => {
      const el = val('s_' + f[0].replace('.', '_')); if (!el) return;
      const key = f[0].split('.')[1];
      out.guess[key] = f[3] === 'check' ? el.checked : (f[3] === 'number' ? Number(el.value) : el.value);
    });
    E.TABLES.models.forEach(m => { const el = val('s_price_' + m); if (el) out.prices[m] = Number(el.value); });
    out.clock.date = val('s_clock_date').value; out.clock.time = val('s_clock_time').value;
    out.ai.mode = val('s_ai_mode').value; out.ai.modelTier = val('s_ai_tier').value; out.ai.model = val('s_ai_model').value.trim();
    out.pending.entry = val('s_p_entry').value; out.pending.erp = val('s_p_erp').value;
    out.pending.stations = val('s_p_stations').value.trim(); out.pending.shifts = val('s_p_shifts').value.trim();
    return out;
  }
  function applySettings() {
    const n = readDrawer(); const G = S.P.guess; const before = clone(S.P); const beforeAi = clone(S.ai); const beforePend = clone(S.pending);
    const bad = [];
    const slots = [n.guess.slot1, n.guess.slot2].filter(x => /^\d{1,2}:\d{2}$/.test(x || ''));
    if (!slots.length) bad.push('固定插單時段至少要有一個');
    if (!(n.guess.wA >= 0)) bad.push('甲的虛擬權重要是數字');
    if (!(n.guess.lossLow <= n.guess.lossMid)) bad.push('罰款「低」上限不能大於「中」上限');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(n.clock.date) || !n.clock.time) bad.push('示意時間要填日期和時間');
    if (bad.length) { toast('沒有套用：' + bad.join('；')); return; }
    const changes = [];
    const cmp = (label, a, b, unit) => { if (String(a) !== String(b)) changes.push(label + ' ' + a + ' → ' + b + (unit || '')); };
    cmp('甲虛擬權重', G.wA, n.guess.wA, '%／天'); cmp('甲最多延後', G.maxDelayA, n.guess.maxDelayA, ' 天');
    cmp('固定插單時段', G.slots.join('、'), slots.join('、')); cmp('同機種合併', G.merge ? '開' : '關', n.guess.merge ? '開' : '關');
    cmp('凍結', G.freezeH, n.guess.freezeH, ' 小時'); cmp('換零件額外換線', G.partExtra, n.guess.partExtra, ' 次');
    cmp('比較位置數', G.nCand, n.guess.nCand); cmp('工作日開始', G.dayStart, n.guess.dayStart, ' 點');
    cmp('罰款低上限', G.lossLow, n.guess.lossLow); cmp('罰款中上限', G.lossMid, n.guess.lossMid);
    E.TABLES.models.forEach(m => cmp('單價 ' + m + '（示意）', S.P.prices[m], n.prices[m], ' 元／片'));
    cmp('示意時間', S.P.clock.date + ' ' + S.P.clock.time, n.clock.date + ' ' + n.clock.time);
    cmp('AI 解析模式', S.ai.mode, n.ai.mode); cmp('模型等級', S.ai.modelTier, n.ai.modelTier); cmp('模型名稱', S.ai.model || '（預設）', n.ai.model || '（預設）');
    cmp('入口形式', S.pending.entry, n.pending.entry); cmp('是否接 ERP', S.pending.erp, n.pending.erp);
    cmp('插件站數', S.pending.stations || '（空）', n.pending.stations || '（空）'); cmp('班次', S.pending.shifts || '（空）', n.pending.shifts || '（空）');
    if (!changes.length) { toast('沒有任何變更'); return; }
    Object.assign(G, n.guess, { slots }); delete G.slot1; delete G.slot2;
    Object.assign(S.P.prices, n.prices); S.P.clock = n.clock;
    Object.assign(S.ai, n.ai); Object.assign(S.pending, n.pending);
    changes.forEach(c => log('系統', '設定變更', '', c + '（操作：業務／生管，Demo 不分帳號）'));
    const affects = changes.some(c => !/^(AI|模型|入口|是否接 ERP|插件|班次)/.test(c));
    if (affects) recalcPending('設定變更');
    S.ui.drawer = false;
    toast('已套用 ' + changes.length + ' 項變更並寫入稽核紀錄' + (affects ? '，待決定的單已重新試算' : ''));
    render();
  }
  function resetSettings() {

  /* ===== 回覆資訊 ===== */
  function replyInfo(o) {
    const calc = latestCalc(o);
    if (!calc) return { calc: null };
    let est, startLabel;
    if (o.decision) { est = o.decision.est; startLabel = o.decision.est.startLabel; }
    else { const b = calc.result.cands[calc.result.best]; est = { endDate: b.endAt.date, endLabel: b.endAt.label, lateX: b.lateX, extraC: b.extraC, extraH: b.extraH }; startLabel = b.startAt.label; }
    const req = dueOf(o);
    const draft = E.replyDraft(o.draft ? o.draft : o, est.endDate, req);
    return { calc, est, dueDate: est.endDate, req, draft, startLabel, onTime: est.endDate <= req };
  }

  /* ===== 畫面：收單 ===== */

    if (k === 'model') {

  /* ===== 畫面：時間軸 ===== */
  function timeline(rows, cal, hlId, title) {
    const Hd = cal.Hday; const maxEnd = Math.max(...rows.map(r => r.end), Hd);
    const nd = Math.min(7, Math.max(2, Math.ceil(maxEnd / Hd - 1e-9)));
    const L = cal.L, ds = cal.ds; const slots = cal.slotHours();
    const pct = h => ((h - ds) / L * 100);
    let html = '<div class="tl"><div class="scale"><span></span><div>' + [ds, ds + 2, ds + 4, ds + 6, ds + 8].filter(h => h <= ds + L + 0.01).map(h => '<span style="left:' + pct(h) + '%">' + U.hhmm(h) + '</span>').join('') + '</div></div>';
    for (let d = 0; d < nd; d++) {
      const date = U.addWork(cal.base, d);
      let blocks = '';
      rows.forEach(r => {
        const a = Math.max(r.start, d * Hd), b = Math.min(r.end, (d + 1) * Hd);
        if (b - a < 1e-6) return;
        const left = (a - d * Hd) / Hd * 100, w = (b - a) / Hd * 100;
        const j = r.job; const lab = j.customer + j.model + ' ' + fmtN(j.qty);
        const cls = 'blk' + (j.id === hlId ? ' x' : '') + (r.late > 0 ? ' late' : '') + (j.running ? ' run' : '');
        blocks += '<div class="' + cls + '" style="left:' + left.toFixed(2) + '%;width:' + w.toFixed(2) + '%" title="' + esc(j.id + ' ' + lab + '；' + cal.at(r.start).label + ' → ' + cal.atEnd(r.end).label + (r.late ? '；預計晚 ' + r.late + ' 天' : '')) + '">' + (w > 7 ? esc(lab) : '') + '</div>';
      });
      const ticks = slots.map(h => '<div class="tick" style="left:' + pct(h) + '%"></div>').join('');
      html += '<div class="day"><div class="dl">' + U.md(date) + '<br>週' + U.WD[U.dow(date)] + '</div><div class="track">' + ticks + blocks + '</div></div>';
    }
    html += '<div class="tl-leg"><span><i></i>已排的單</span><span><i class="x"></i>這張單</span><span><i class="late"></i>預計晚交</span><span>虛線：固定插單時段 ' + slots.map(U.hhmm).join('、') + '</span></div></div>';
    return html;
  }

  /* ===== 畫面：生管看板 ===== */

      '<li>罰款：乙 2%／天、丙 1%／天（個案合約）；甲沒有合約罰款，用虛擬權重 ' + G.wA + '%／天 ' + guessTag() + '</li>' +
      '<li>甲最多延後 ' + G.maxDelayA + ' 天 ' + guessTag() + '；固定插單時段 ' + G.slots.join('、') + ' ' + guessTag() + '；凍結 ' + G.freezeH + ' 小時 ' + guessTag() + '；同機種合併 ' + (G.merge ? '開' : '關') + ' ' + guessTag() + '</li>' +
      '<li>單價為示意（' + E.TABLES.models.map(m => m + ' ' + P.prices[m] + ' 元／片').join('、') + '），金額只用來排序，不是報價</li>' +
      '<li>沒有計入插件站數與班次（資料沒有，目前插件站是瓶頸）</li></ul>';
  }
  function candTable(o, calc, selK, selectable) {
    const r = calc.result;
    return '<div class="scroll-x"><table class="cmp"><thead><tr>' + (selectable ? '<th></th>' : '') + '<th>排在這張之後</th><th>預計開工</th><th>預計完成</th><th>額外換線</th><th>本單延誤</th><th>罰款增加</th><th>風險</th></tr></thead><tbody>' +
      r.cands.map((c, i) => { const rk = E.risk(c, r.cal, calc.P);
        return '<tr class="' + (i === r.best ? 'best ' : '') + (selectable && selK === c.k ? 'sel' : '') + '">' +
          (selectable ? '<td><input type="radio" name="cand-' + o.id + '" value="' + c.k + '" data-act-change="cand" data-id="' + o.id + '"' + (selK === c.k ? ' checked' : '') + ' aria-label="排在 ' + c.afterId + ' 之後"></td>' : '') +
          '<td>' + esc(c.afterId + ' ' + c.after.customer + c.after.model) + (i === r.best ? ' ' + tag('ai', '建議') : '') + '</td><td>' + c.startAt.label + '</td><td>' + c.endAt.label + '</td><td>' + c.extraC + ' 次</td><td>' + (c.lateX ? c.lateX + ' 天' : '0') + '</td><td>' + yen(c.deltaLoss) + '</td><td>' + rk.label + '</td></tr>'; }).join('') +
      '</tbody></table></div>';
  }
  function aiPanel(o, calc) {
    const r = calc.result, c = r.cands[r.best], P = calc.P; const rk = E.risk(c, r.cal, P); const ll = E.lossLevel(c.deltaLoss, P);
    const x = c.x; const runH = o.draft.fields.qty.value / P.data.rate;
    const merge = (() => {
      const m = r.cands.filter(z => z.sameModelAdj);
      if (c.sameModelAdj) return '建議位置與同機種相鄰，已併單。';
      if (m.length) { const z = m.sort((a, b) => a.totalLoss - b.totalLoss)[0]; return '併單位置：排在 ' + z.afterId + ' 之後，可少換線，但罰款增加 ' + yen(z.deltaLoss) + '，建議位置是 ' + yen(c.deltaLoss) + '。'; }

    })();

    if (c.aLate.length) flags.push('甲的單預計晚過 ' + P.guess.maxDelayA + ' 天（上限，【我猜的】），建議交老闆決定。');
    if (c.newLate.length) flags.push('連帶變遲：' + c.newLate.map(n => n.id + ' ' + n.customer + n.model + ' 晚 ' + n.late + ' 天').join('、') + '。');

    return '<dl style="margin:0">' +
      '<div class="arow"><dt>插入時機</dt><dd><b>排在 ' + esc(c.afterId + ' ' + c.after.customer + c.after.model + ' ' + fmtN(c.after.qty)) + ' 之後</b>，預計 ' + c.startAt.label + ' 開工、' + c.endAt.label + ' 完成。<span class="fm">' + esc(r.entry.label) + ' 的固定時段排入；不拆單，前一張做完才換</span></dd></div>' +
      '<div class="arow"><dt>單量與工時</dt><dd>' + fmtN(x.job.qty) + ' 片，約 ' + (runH + c.cX * P.data.changeoverH).toFixed(2) + ' 小時<span class="fm">' + fmtN(x.job.qty) + ' ÷ ' + P.data.rate + ' = ' + runH.toFixed(2) + ' h；本單換線 ' + c.cX + ' 次 × ' + P.data.changeoverH.toFixed(2) + ' = ' + (c.cX * P.data.changeoverH).toFixed(2) + ' h</span></dd></div>' +
      '<div class="arow"><dt>換線</dt><dd>這次插單多出 <b>' + c.extraC + ' 次</b>（' + c.extraH.toFixed(2) + ' 小時）<span class="fm">本單 ' + c.cX + ' 次；下一張 ' + c.cNextOld + ' → ' + c.cNextNew + ' 次（' + (c.cNextNew - c.cNextOld >= 0 ? '+' : '−') + Math.abs(c.cNextNew - c.cNextOld) + '）；合計 ' + c.cX + (c.cNextNew - c.cNextOld >= 0 ? ' + ' : ' − ') + Math.abs(c.cNextNew - c.cNextOld) + ' = ' + extra + ' 次</span></dd></div>' +
      '<div class="arow"><dt>罰款損失</dt><dd><span class="pill l' + ll.level + '">' + ll.label + '</span> ' + yen(c.deltaLoss) + '（本單 ' + yen(c.lossX) + '，連帶 ' + yen(c.deltaLoss - c.lossX) + '）<span class="fm">每張 = 金額 × 日罰款率 × 晚的天數；' + esc(x.job.customer) + ' 的日罰款率 ' + (x.rate * 100).toFixed(2).replace(/\.?0+$/, '') + '%' + (x.job.customer === '甲' ? '（虛擬，非合約罰款）' : '') + '，本單金額 ' + yen(x.amount) + '（示意單價）</span></dd></div>' +
      '<div class="arow"><dt>準時風險</dt><dd><span class="pill l' + rk.level + '">' + rk.label + '</span> ' + esc(rk.why.join('；')) + '；要求 ' + U.mdw(x.job.due) + '</dd></div>' +
      '<div class="arow"><dt>併單建議</dt><dd>' + esc(merge) + '</dd></div>' +
      (flags.length ? '<div class="arow"><dt>注意</dt><dd>' + flags.map(esc).join('<br>') + '</dd></div>' : '') +
      '</dl>' +

      n: os.length, decided: decided.length, adopt: decided.filter(o => o.decision.type === 'adopt').length, adjust: decided.filter(o => o.decision.type === 'adjust').length,
