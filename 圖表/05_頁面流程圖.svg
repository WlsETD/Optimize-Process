<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" width="1360" height="936" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>單一插單入口頁面流程圖</title><desc>五個頁面由左到右：收單頁、確認頁、生管看板、交期回覆頁、指標頁，每頁以線框示意內容與按鈕。</desc><style>
