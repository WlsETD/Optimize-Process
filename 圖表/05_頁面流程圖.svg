lass="ts" x="466.0" y="99.0" text-anchor="middle" dominant-baseline="central">試算：已完成</text></g><rect class="box" x="418" y="120" width="96" height="60" rx="4" stroke-width="0.5"/><text class="ts" x="466" y="140" text-anchor="middle" dominant-baseline="central">交期草稿</text><text class="th" x="466" y="162" text-anchor="middle" dominant-baseline="central">11/21 出貨</text><rect class="box" x="418" y="188" width="96" height="44" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="466" y="202" text-anchor="middle" dominant-baseline="central">沒有試算時</text><text class="ts" x="466" y="220" text-anchor="middle" dominant-baseline="central">按鈕不能按</text><g class="c-teal"><rect x="418" y="244" width="96" height="30" rx="4" stroke-width="0.5"/><text class="th" x="466.0" y="259.0" text-anchor="middle" dominant-baseline="central">複製回覆</text></g><g class="c-purple"><rect x="548" y="86" width="46" height="40" rx="4" stroke-width="0.5"/><text class="ts" x="571.0" y="106.0" text-anchor="middle" dominant-baseline="central">出貨量</text></g><g class="c-purple"><rect x="598" y="86" width="46" height="40" rx="4" stroke-width="0.5"/><text class="ts" x="621.0" y="106.0" text-anchor="middle" dominant-baseline="central">準時率</text></g><g class="c-purple"><rect x="548" y="132" width="46" height="40" rx="4" stroke-width="0.5"/><text class="ts" x="571.0" y="152.0" text-anchor="middle" dominant-baseline="central">換線</text></g><g class="c-purple"><rect x="598" y="132" width="46" height="40" rx="4" stroke-width="0.5"/><text class="ts" x="621.0" y="152.0" text-anchor="middle" dominant-baseline="central">誤差</text></g><rect class="box" x="548" y="182" width="96" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="596.0" y="195.0" text-anchor="middle" dominant-baseline="central">稽核紀錄 ›</text><text class="ts" x="596" y="259" text-anchor="middle" dominant-baseline="central">唯讀</text><text class="ts" x="20" y="308" dominant-baseline="central">A　業務按「解析」，進確認頁</text><text class="ts" x="20" y="330" dominant-baseline="central">B　業務按「送出」，系統試算後送到生管看板（欄位缺或信心低，按「追問」留在確認頁）</text><text class="ts" x="20" y="352" dominant-baseline="central">C　生管按「採用」或「調整」，結果帶到交期回覆頁</text><text class="ts" x="20" y="374" dominant-baseline="central">D　業務複製回覆給客戶；沒有試算，按鈕不能按</text><text class="ts" x="20" y="396" dominant-baseline="central">每天　回覆與實際結果彙整到指標頁，給老闆看（唯讀）</text><g class="c-teal"><rect x="20" y="440" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="40" y="446" dominant-baseline="central">人操作的頁</text><g class="c-purple"><rect x="130" y="440" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="150" y="446" dominant-baseline="central">系統產生內容</text><g class="c-gray"><rect x="240" y="440" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="260" y="446" dominant-baseline="central">唯讀或輔助</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>