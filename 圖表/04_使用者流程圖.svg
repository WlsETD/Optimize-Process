.t{font-size:14px;fill:#1f1f1f}
.ts{font-size:12px;fill:#555}
.th{font-size:14px;font-weight:600;fill:#1f1f1f}
.box{fill:#fff;stroke:#8a8a84}
.arr{stroke:#6b6b66;stroke-width:1.5;fill:none}
.c-gray rect{fill:#f1efe8;stroke:#5f5e5a}
.c-gray text{fill:#2c2c2a}
.c-teal rect{fill:#e1f5ee;stroke:#0f6e56}
.c-teal text{fill:#04342c}
.c-purple rect{fill:#eeedfe;stroke:#534ab7}
.c-purple text{fill:#26215c}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="872" fill="#ffffff"/><g class="node c-gray"><rect x="200" y="20" width="200" height="52" rx="8" stroke-width="0.5"/><text class="th" x="300.0" y="37" text-anchor="middle" dominant-baseline="central">接到客戶插單</text><text class="ts" x="300.0" y="57" text-anchor="middle" dominant-baseline="central">老闆</text></g><g class="node c-gray"><rect x="200" y="92" width="200" height="52" rx="8" stroke-width="0.5"/><text class="th" x="300.0" y="109" text-anchor="middle" dominant-baseline="central">LINE 轉傳給業務</text><text class="ts" x="300.0" y="129" text-anchor="middle" dominant-baseline="central">老闆</text></g><g class="node c-teal"><rect x="200" y="164" width="200" height="52" rx="8" stroke-width="0.5"/><text class="th" x="300.0" y="181" text-anchor="middle" dominant-baseline="central">貼上原文，一行字</text><text class="ts" x="300.0" y="201" text-anchor="middle" dominant-baseline="central">業務</text></g><g class="node c-purple"><rect x="200" y="236" width="200" height="52" rx="8" stroke-width="0.5"/><text class="th" x="300.0" y="253" text-anchor="middle" dominant-baseline="central">AI 解析欄位草稿</text><text class="ts" x="300.0" y="273" text-anchor="middle" dominant-baseline="central">系統</text></g><polygon class="box" points="300,308 400.0,340.0 300,372 200.0,340.0" stroke-width="0.5"/><text class="ts" x="300" y="332.0" text-anchor="middle" dominant-baseline="central">欄位齊全？</text><text class="ts" x="300" y="349.0" text-anchor="middle" dominant-baseline="central">信心夠高？</text><g class="node c-teal"><rect x="200" y="392" width="200" height="52" rx="8" stroke-width="0.5"/><text class="th" x="300.0" y="409" text-anchor="middle" dominant-baseline="central">確認後送出</text><text class="ts" x="300.0" y="429" tex