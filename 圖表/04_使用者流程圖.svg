ss="arr" x1="300" y1="516" x2="300" y2="536" marker-end="url(#arrow)"/><line class="arr" x1="300" y1="588" x2="300" y2="608" marker-end="url(#arrow)"/><line class="arr" x1="300" y1="672" x2="300" y2="692" marker-end="url(#arrow)"/><line class="arr" x1="300" y1="744" x2="300" y2="764" marker-end="url(#arrow)"/><text class="ts" x="314" y="382" dominant-baseline="central">是</text><text class="ts" x="314" y="682" dominant-baseline="central">是</text><line class="arr" x1="400" y1="340" x2="470" y2="340" marker-end="url(#arrow)"/><text class="ts" x="428" y="330" text-anchor="middle" dominant-baseline="central">否</text><g class="node c-teal"><rect x="470" y="314" width="160" height="52" rx="8" stroke-width="0.5"/><text class="th" x="550.0" y="331" text-anchor="middle" dominant-baseline="central">追問缺的欄位</text><text class="ts" x="550.0" y="351" text-anchor="middle" dominant-baseline="central">業務補齊</text></g><line class="arr" x1="550" y1="314" x2="550" y2="262"/><line class="arr" x1="550" y1="262" x2="400" y2="262" marker-end="url(#arrow)"/><line class="arr" x1="400" y1="640" x2="470" y2="640" marker-end="url(#arrow)"/><text class="ts" x="428" y="630" text-anchor="middle" dominant-baseline="central">否</text><g class="node c-teal"><rect x="470" y="614" width="160" height="52" rx="8" stroke-width="0.5"/><text class="th" x="550.0" y="631" text-anchor="middle" dominant-baseline="central">調整並記下原因</text><text class="ts" x="550.0" y="651" text-anchor="middle" dominant-baseline="central">生管</text></g><line class="arr" x1="550" y1="666" x2="550" y2="718"/><line class="arr" x1="550" y1="718" x2="400" y2="718" marker-end="url(#arrow)"/><text class="ts" x="190" y="190" text-anchor="end" dominant-baseline="central">一行字，不用填表</text><text class="ts" x="190" y="262" text-anchor="end" dominant-baseline="central">只拆欄位，原文不改</text><text class="ts" x="190" y="418" text-anchor="end" dominant-baseline="central">原文原封不動往下送</text><text class="ts" x="190" y="490" text-anchor="end" dominant-baseline="central">甲最多延後 1 天【猜】</text><text class="ts" x="190" y="562" text-anchor="end" dominant-baseline="central">看到時機、單量、罰款</text><text class="ts" x="190" y="718" text-anchor="end" dominant-baseline="central">沒有試算，系統不放行</text><text class="ts" x="190" y="790" text-anchor="end" dominant-baseline="central">試算與實際比對</text><g class="c-gray"><rect x="20" y="846" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="40" y="852" dominant-baseline="central">老闆</text><g class="c-teal"><rect x="130" y="846" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="150" y="852" dominant-baseline="central">業務與生管</text><g class="c-purple"><rect x="240" y="846" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="260" y="852" dominant-baseline="central">系統</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>