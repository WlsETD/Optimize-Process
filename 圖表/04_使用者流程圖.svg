<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 872" width="1360" height="1744" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>單一插單入口使用者流程圖</title><desc>老闆接單並用 LINE 轉給業務，業務貼上原文，AI 解析，欄位不足就追問，確認後 AI 試算排序，生管看建議並決定，業務依試算回覆客戶，系統回填實際結果。</desc><style>
