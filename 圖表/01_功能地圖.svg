.arr{stroke:#6b6b66;stroke-width:1.5;fill:none}
.c-gray rect{fill:#f1efe8;stroke:#5f5e5a}
.c-gray text{fill:#2c2c2a}
.c-teal rect{fill:#e1f5ee;stroke:#0f6e56}
.c-teal text{fill:#04342c}
.c-purple rect{fill:#eeedfe;stroke:#534ab7}
.c-purple text{fill:#26215c}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="480" fill="#ffffff"/><g class="node c-gray"><rect x="40" y="48" width="104" height="56" rx="8" stroke-width="0.5"/><text class="th" x="92.0" y="66" text-anchor="middle" dominant-baseline="central">收單入口</text><text class="ts" x="92.0" y="86" text-anchor="middle" dominant-baseline="central">老闆→業務</text></g><line class="arr" x1="144" y1="76" x2="162" y2="76" marker-end="url(#arrow)"/><rect class="box" x="40" y="124" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="92.0" y="140.0" text-anchor="middle" dominant-baseline="central">LINE 轉傳</text><rect class="box" x="40" y="164" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="92.0" y="180.0" text-anchor="middle" dominant-baseline="central">一行字輸入</text><rect class="box" x="40" y="204" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="92.0" y="220.0" text-anchor="middle" dominant-baseline="central">來源標記</text><rect class="box" x="40" y="244" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="92.0" y="260.0" text-anchor="middle" dominant-baseline="central">原文留存</text><g class="node c-teal"><rect x="164" y="48" width="104" height="56" rx="8" stroke-width="0.5"/><text class="th" x="216.0" y="66" text-anchor="middle" dominant-baseline="central">業務確認</text><text class="ts" x="216.0" y="86" text-anchor="middle" dominant-baseline="central">業務</text></g><line class="arr" x1="268" y1="76" x2="286" y2="76" marker-end="url(#arrow)"/><rect class="box" x="164" y="124" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="216.0" y="140.0" text-anchor="middle" dominant-baseline="central">AI 欄位草稿</text><rect class="box" x="164" y="164" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="216.0" y="180.0" text-anchor="middle" dominant-baseline="central">缺欄位追問</text><rect class="box" x="164" y="204" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="216.0" y="220.0" text-anchor="middle" dominant-baseline="central">信心標紅</text><rect class="box" x="164" y="244" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="216.0" y="260.0" text-anchor="middle" dominant-baseline="central">確認／退回</text><g class="node c-purple"><rect x="288" y="48" width="104" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="66" text-anchor="middle" dominant-baseline="central">AI 分析</text><text class="ts" x="340.0" y="86" text-anchor="middle" dominant-baseline="central">系統</text></g><line class="arr" x1="392" y1="76" x2="410" y2="76" marker-end="url(#arrow)"/><rect class="box" x="288" y="124" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="340.0" y="140.0" text-anchor="middle" dominant-baseline="central">換線試算</text><rect class="box" x="288" y="164" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="340.0" y="180.0" text-anchor="middle" dominant-baseline="central">插單時機</text><rect class="box" x="288" y="204" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="340.0" y="220.0" text-anchor="middle" dominant-baseline="central">罰款加權</text><rect class="box" x="288" y="244" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="340.0" y="260.0" text-anchor="middle" dominant-baseline="central">準時風險</text><g class="node c-teal"><rect x="412" y="48" width="104" height="56" rx="8" stroke-width="0.5"/><text class="th" x="464.0" y="66" text-anchor="middle" dominant-baseline="central">生管看板</text><text class="ts" x="464.0" y="86" text-anchor="middle" dominant-baseline="central">生管</text></g><line class="arr" x1="516" y1="76" x2="534" y2="76" marker-end="url(#arrow)"/><rect class="box" x="412" y="124" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="464.0" y="140.0" text-anchor="middle" dominant-baseline="central">原單原樣</text><rect class="box" x="412" y="164" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="464.0" y="180.0" text-anchor="middle" dominant-baseline="central">AI 建議</text><rect class="box" x="412" y="204" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="464.0" y="220.0" text-anchor="middle" dominant-baseline="central">採用／調整</text><rect class="box" x="412" y="244" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="464.0" y="260.0" text-anchor="middle" dominant-baseline="central">決定紀錄</text><g class="node c-teal"><rect x="536" y="48" width="104" height="56" rx="8" stroke-width="0.5"/><text class="th" x="588.0" y="66" text-anchor="middle" dominant-baseline="central">交期回覆</text><text class="ts" x="588.0" y="86" text-anchor="middle" dominant-baseline="central">業務→客戶</text></g><rect class="box" x="536" y="124" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="588.0" y="140.0" text-anchor="middle" dominant-baseline="central">交期草稿</text><rect class="box" x="536" y="164" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="588.0" y="180.0" text-anchor="middle" dominant-baseline="central">無試算不發</text><rect class="box" x="536" y="204" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="588.0" y="220.0" text-anchor="middle" dominant-baseline="central">老闆決定</text><rect class="box" x="536" y="244" width="104" height="32" rx="4" stroke-width="0.5"/><text class="t" x="588.0" y="260.0" text-anchor="middle" dominant-baseline="central">回覆紀錄</text><g class="c-gray"><rect x="40" y="296" width="600" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 4"/><text class="th" x="340.0" y="315.0" text-anchor="middle" dominant-baseline="central">貫穿全流程</text><text class="ts" x="340.0" y="335.0" text-anchor="middle" dominant-baseline="central">原文不改、步步留紀錄、AI 只建議、人決定</text></g><g class="c-gray"><rect x="40" y="368" width="600" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 4"/><text class="th" x="340.0" y="387.0" text-anchor="middle" dominant-baseline="central">第二階段，不在本次 Demo</text><text class="ts" x="340.0" y="407.0" text-anchor="middle" dominant-baseline="central">電話錄音、正式單 API、換線外部化、齊套</text></g><g class="c-teal"><rect x="20" y="444" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="40" y="450" dominant-baseline="central">人做決定</text><g class="c-purple"><rect x="130" y="444" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="150" y="450" dominant-baseline="central">系統運算</text><g class="c-gray"><rect x="240" y="444" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="260" y="450" dominant-baseline="central">入口與底座</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>