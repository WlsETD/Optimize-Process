<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="1360" height="808" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>單一插單入口資訊架構圖</title><desc>資料來源匯入同一張單據（原始訊息、解析欄位、試算結果、生管決定、交期回覆），再由五個畫面讀取；可調參數只影響試算結果。</desc><style>
svg{font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif}
.t{font-size:14px;fill:#1f1f1f}
.ts{font-size:12px;fill:#555}
.th{font-size:14px;font-weight:600;fill:#1f1f1f}
.box{fill:#fff;stroke:#8a8a84}
.arr{stroke:#6b6b66;stroke-width:1.5;fill:none}
.c-gray rect{fill:#f1efe8;stroke:#5f5e5a}
.c-gray text{fill:#2c2c2a}
.c-teal rect{fill:#e1f5ee;stroke:#0f6e56}
.c-teal text{fill:#04342c}
.c-purple rect{fill:#eeedfe;stroke:#534ab7}
.c-purple text{fill:#26215c}
