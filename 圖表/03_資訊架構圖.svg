期回覆</text><text class="ts" x="596.0" y="148" text-anchor="middle" dominant-baseline="central">需對應試算</text></g><line class="arr" x1="76.0" y1="160" x2="76.0" y2="174"/><line class="arr" x1="206.0" y1="160" x2="206.0" y2="174"/><line class="arr" x1="336.0" y1="160" x2="336.0" y2="174"/><line class="arr" x1="466.0" y1="160" x2="466.0" y2="174"/><line class="arr" x1="596.0" y1="160" x2="596.0" y2="174"/><line class="arr" x1="76.0" y1="174" x2="596.0" y2="174"/><text class="ts" x="20" y="182" dominant-baseline="central">畫面</text><line class="arr" x1="76.0" y1="174" x2="76.0" y2="192" marker-end="url(#arrow)"/><line class="arr" x1="206.0" y1="174" x2="206.0" y2="192" marker-end="url(#arrow)"/><line class="arr" x1="336.0" y1="174" x2="336.0" y2="192" marker-end="url(#arrow)"/><line class="arr" x1="466.0" y1="174" x2="466.0" y2="192" marker-end="url(#arrow)"/><line class="arr" x1="596.0" y1="174" x2="596.0" y2="192" marker-end="url(#arrow)"/><g class="node c-teal"><rect x="20" y="194" width="112" height="50" rx="8" stroke-width="0.5"/><text class="th" x="76.0" y="212" text-anchor="middle" dominant-baseline="central">業務確認頁</text><text class="ts" x="76.0" y="232" text-anchor="middle" dominant-baseline="central">原文與欄位</text></g><g class="node c-teal"><rect x="150" y="194" width="112" height="50" rx="8" stroke-width="0.5"/><text class="th" x="206.0" y="212" text-anchor="middle" dominant-baseline="central">生管看板</text><text class="ts" x="206.0" y="232" text-anchor="middle" dominant-baseline="central">原單加建議</text></g><g class="node c-teal"><rect x="280" y="194" width="112" height="50" rx="8" stroke-width="0.5"/><text class="th" x="336.0" y="212" text-anchor="middle" dominant-baseline="central">交期回覆頁</text><text class="ts" x="336.0" y="232" text-anchor="middle" dominant-baseline="central">試算後才發</text></g><g class="node c-purple"><rect x="410" y="194" width="112" height="50" rx="8" stroke-width="0.5"/><text class="th" x="466.0" y="212" text-anchor="middle" dominant-baseline="central">指標頁</text><text class="ts" x="466.0" y="232" text-anchor="middle" dominant-baseline="central">KPI 與誤差</text></g><g class="node c-gray"><rect x="540" y="194" width="112" height="50" rx="8" stroke-width="0.5"/><text class="th" x="596.0" y="212" text-anchor="middle" dominant-baseline="central">稽核紀錄</text><text class="ts" x="596.0" y="232" text-anchor="middle" dominant-baseline="central">誰何時決定</text></g><g class="c-gray"><rect x="20" y="266" width="632" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 4"/><text class="th" x="336.0" y="285.0" text-anchor="middle" dominant-baseline="central">可調參數（【我猜的】，待老闆確認）</text><text class="ts" x="336.0" y="305.0" text-anchor="middle" dominant-baseline="central">插單時段 10:00／15:00　凍結 48 h　甲最多延後 1 天　甲權重 1–1.5%/天</text></g><text class="ts" x="340" y="342" text-anchor="middle" dominant-baseline="central">參數只影響「試算結果」，改了參數要留下紀錄</text><g class="c-purple"><rect x="20" y="376" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="40" y="382" dominant-baseline="central">系統產生</text><g class="c-teal"><rect x="130" y="376" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="150" y="382" dominant-baseline="central">人決定／人看</text><g class="c-gray"><rect x="240" y="376" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="260" y="382" dominant-baseline="central">原始與底座</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>